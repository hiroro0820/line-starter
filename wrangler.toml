# 受け口（Cloudflare Workers）。Deploy to Cloudflare のボタンが読む。置き場（KV）は自動で作られる
name = "orbit-package"
main = "receiver/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "MEDIA"

[[kv_namespaces]]
binding = "CONFIG"

[vars]
ONBOARD_API = "https://orbit-package.com/api/onboard"
GOOGLE_CLIENT_ID = "964060622908-3bu234gembpqbk6khked80k2sj5eikk9.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET = ""   # 導入コードを入れると入る
